# AirLLM Helm values. Everything here is a PLACEHOLDER — supply real values at deploy
# time (or via an ArgoCD Application / a values file kept out of this public repo).
# Secrets are NEVER set here: the chart references an existing Secret by name.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/OWNER/ipsupport-airllm   # placeholder
  tag: ""                                       # defaults to .Chart.AppVersion
  digest: ""                                    # sha256:… — pins the exact build, wins over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []                            # e.g. [{ name: regcred }]

# Secret-tool-agnostic: create this Secret out-of-band (Vault/VSO/ESO/SealedSecrets).
# Required keys:  database-url, redis-url, master-key, session-key
# Conditional:    oidc-client-secret (when config.authMode=oidc), admin-password (optional bootstrap)
existingSecret: ""                              # REQUIRED — templating fails if empty

config:                                         # non-secret env (rendered into a ConfigMap)
  env: prod                                     # ENV: dev | prod (dev uses an insecure derived master key if master-key is unset)
  # SEED_DEV: seed demo users with the fixed password devpass123 and a
  # well-known, active API key. Local development only — anyone who can reach
  # the gateway could use them. Requires env: dev and authMode: local.
  seedDev: false
  httpAddr: ":8080"                             # the container port follows the port given here
  authMode: local                               # local | oidc
  adminUsername: admin
  captureBlobDir: /var/lib/airllm/captures
  # Every replica keeps providers, prices and a few settings in memory; a save
  # through the admin console reaches the OTHER replicas on their next refresh.
  configRefreshInterval: 10s
  # On SIGTERM the pod keeps accepting requests for shutdownDrain (the load balancer
  # needs a moment to stop routing to it), then gives in-flight requests — streams
  # included — up to shutdownTimeout. Keep their sum below
  # app.terminationGracePeriodSeconds.
  shutdownDrain: 5s
  shutdownTimeout: 20s
  # Ceiling on a single non-streaming upstream chat/embeddings call,
  # independent of a routing target's own timeout_ms. Raise it for a
  # local upstream with a long time-to-first-token on non-streaming
  # requests.
  upstreamChatTimeout: 120s
  # Comma-separated request header names copied onto the outbound upstream
  # request, alongside the gateway's own Content-Type/Authorization/Accept
  # (which this can never override). Empty by default — opt in per name.
  forwardHeaders: ""
  # TRUSTED_PROXY_CIDRS: comma-separated networks whose X-Forwarded-For is
  # believed when working out a client's IP (login lockout, live view). Empty
  # = every loopback/private/link-local range. Set it to your ingress
  # controller's pod CIDR so another in-cluster caller can't claim any IP.
  trustedProxyCIDRs: ""
  # LIMITS_TZ: IANA time zone the per-user budget periods follow (a day starts
  # at 00:00, a week on Monday, a month on the 1st there). An unknown zone
  # fails startup.
  limitsTZ: UTC
  oidc:                                         # used only when authMode: oidc (non-secret parts)
    issuer: ""
    clientId: ""
    redirectUrl: ""
    scopes: "openid profile email"           # SPACE-delimited (the app parses with strings.Fields)
    rolesClaim: ""
    roleMap: ""
    # OIDC_ALLOW_HTTP_ISSUER: accept a plain-http issuer (e.g. an IdP Service
    # inside the cluster). Discovery, JWKS and the token exchange (with the
    # client secret) then travel unencrypted — prefer https.
    allowHttpIssuer: false

# Google Cloud Workload Identity Federation. OFF by default — enabling it is the ONLY
# thing that changes the rendered release, so an upgrade that leaves it off is a no-op.
#
# When on, the pod gets a projected OIDC token plus an "external account" credential
# config (read-only mounts, so app.securityContext.readOnlyRootFilesystem stays on).
# That is what lets a `vertex` provider be registered with an EMPTY credential: no
# service-account key stored anywhere. The cloud side — pool, provider and an IAM
# policy letting THIS namespace impersonate the service account — is a prerequisite
# the chart cannot check. See docs/operations.md#google-workload-identity-federation.
googleWorkloadIdentity:
  enabled: false
  projectNumber: ""                             # numeric project number owning the pool (NOT the project id) — QUOTE it
  poolId: ""                                    # workload identity pool id
  providerId: ""                                # provider id within that pool
  serviceAccount: ""                            # SA email to impersonate, e.g. airllm@my-project.iam.gserviceaccount.com
  tokenExpirationSeconds: 3600                  # kubelet refreshes the projected token well before this

app:
  replicaCount: 2                               # used only when app.autoscaling.enabled=false
  service:
    type: ClusterIP
    port: 8080
  # The Ingress routes every path on the host to the gateway, /metrics
  # included, and /metrics has no auth (it is meant for in-cluster Prometheus
  # scraping). On a public host, block /metrics at the ingress controller —
  # e.g. an nginx `server-snippet` returning 404 for it, or a Traefik
  # IngressRoute that excludes the path — or keep the Ingress private.
  ingress:
    enabled: false
    className: ""
    host: airllm.example.com                    # placeholder
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  terminationGracePeriodSeconds: 30             # > config.shutdownDrain + config.shutdownTimeout
  # Budget for boot up to the schema migrations (periodSeconds x
  # failureThreshold, default ~60s). /healthz passes while a migration runs
  # and for 60s after, and readiness holds traffic until setup finishes, so a
  # long migration needs no larger budget
  # (see docs/operations.md#upgrades-and-long-migrations).
  startupProbe:
    periodSeconds: 3
    failureThreshold: 20
  podDisruptionBudget:                          # caps voluntary disruptions (node drains, upgrades)
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001                              # matches the image user (uid 10001) so a mounted PVC is writable
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
    readOnlyRootFilesystem: true
  capture:                                      # writable path for capture blobs
    persistence:
      enabled: false                            # false → emptyDir; true → PVC
      size: 1Gi
      storageClass: ""
      # ReadWriteOnce works for a single writer only. If you enable persistence,
      # EITHER set app.autoscaling.enabled=false (and replicaCount: 1) OR use a
      # ReadWriteMany storage class here — otherwise replicas 2+ fail to mount.
      # With ReadWriteOnce the Deployment uses the Recreate strategy (a rolling
      # update's new pod could not mount the volume the old pod still holds),
      # so an upgrade has a short outage.
      accessMode: ReadWriteOnce
  nodeSelector: {}
  tolerations: []
  affinity: {}

dlpBert:
  enabled: true
  image:
    repository: ghcr.io/OWNER/ipsupport-airllm-dlp-bert   # placeholder
    tag: ""                                     # defaults to the chart appVersion — pin explicitly (separate artifact from the gateway)
    digest: ""                                  # sha256:… — pins the exact build, wins over tag
    pullPolicy: IfNotPresent
  service:
    # The gateway's modelpool fans out to one endpoint PER POD by resolving
    # this Service's hostname via DNS — that only returns one A record per
    # backing pod when the Service is headless. A ClusterIP Service resolves
    # to a single virtual IP regardless of replica count, collapsing the pool
    # to one endpoint, so modelMaxConcurrency then caps the WHOLE sidecar
    # fleet instead of each pod. Set true for any install that runs (or
    # autoscales to) more than one dlp-bert replica.
    # Kept false by default only because a Service's clusterIP is immutable:
    # flipping an existing install to true makes `helm upgrade` fail until the
    # old Service is deleted (kubectl delete svc <release>-dlp-bert, then
    # upgrade). Fresh installs can set it from the start.
    headless: false
    port: 8000                                  # also the sidecar's listen port (PORT env)
  replicaCount: 1                               # used only when autoscaling.kind=none
  modelMaxConcurrency: 4                        # seeded into the DB-backed DLP config on first boot (see internal/seed.EnsureDLPDefaults); an operator save in the console always wins afterward
  autoscaling:
    kind: hpa                                   # hpa | keda | none
    minReplicaCount: 1                          # set 0 for scale-to-zero (keda only)
    maxReplicaCount: 10
    cpu:
      targetUtilizationPercentage: 70
    keda:
      # KEDA reads a GATEWAY metric, so Prometheus MUST be scraping the gateway's
      # /metrics for this to work — enable metrics.serviceMonitor (or another scrape
      # config) and point prometheusServerAddress at that Prometheus. With keda +
      # minReplicaCount:0 and nothing scraping the gateway, the trigger gets no data
      # and the pool stays pinned at 0 (DLP model layer silently off).
      prometheusServerAddress: http://prometheus-operated.monitoring.svc:9090  # placeholder
      # Scale on the pool DROPPING scans. Default counts BOTH skip reasons so it works
      # for always-warm (minReplicaCount>=1; all_busy dominates) AND scale-to-zero
      # (minReplicaCount: 0 — the no_endpoints rate wakes the pool from 0; a CPU/memory
      # trigger alone cannot scale up from 0).
      # CAVEAT: a PERSISTENT no_endpoints cause unrelated to capacity (wrong DLP
      # model_url, DNS failure, NetworkPolicy) will ramp BERT to maxReplicaCount and
      # stay there uselessly (bounded cost, not an outage). Mitigate by alerting on
      # skipped_total{reason="no_endpoints"}, keeping maxReplicaCount modest, or
      # narrowing query to {reason="all_busy"} when you don't run scale-to-zero.
      # This query is UNSCOPED: if your Prometheus scrapes more than one
      # AirLLM install, add a label selector (e.g. namespace="...", or
      # whatever your ServiceMonitor/scrape relabeling attaches) so one
      # installation's skip rate can't wake — or keep awake — another's pool.
      # reason="truncated" is excluded: it counts scans that succeeded on an
      # over-long message, which more replicas cannot fix.
      query: sum(rate(airllm_dlp_model_skipped_total{reason!="truncated"}[2m]))
      threshold: "1"                            # add replicas when the query exceeds this
      activationThreshold: "0"                  # query must exceed this to scale 0->1 (keep 0 so any demand wakes it)
      pollingInterval: 30
      cooldownPeriod: 300
  # Needs a dlp-bert image built from this chart's version or later: older
  # images run as root and keep the model under /root, unreadable as 10001.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001                            # matches the image user
    runAsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
    readOnlyRootFilesystem: true                # /tmp gets an emptyDir
  resources:
    requests: { cpu: 500m, memory: 1Gi }        # placeholder (torch + model weights)
    limits: { cpu: "2", memory: 4Gi }
    # GPU example: add `nvidia.com/gpu: "1"` under limits and a matching nodeSelector/tolerations.
  nodeSelector: {}
  tolerations: []
  affinity: {}

metrics:
  serviceMonitor:                               # requires the Prometheus Operator CRDs
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}                                  # e.g. { release: kube-prometheus-stack }
  dashboards:                                   # ConfigMap for the Grafana dashboards sidecar
    enabled: false
    labels:
      grafana_dashboard: "1"
  prometheusRule:                               # alert rules; requires the Prometheus Operator CRDs
    enabled: false
    namespace: ""
    labels: {}                                  # e.g. { release: kube-prometheus-stack }, to match the rule selector
    # A tier quarantined this long behind a working fallback fires
    # AirLLMTierQuarantined. A failing probe re-opens the tier, so a provider
    # that stays down keeps it out of `closed` for the whole time.
    tierQuarantinedFor: 15m
    alertLabels:                                # added to every alert, e.g. for Alertmanager routing
      severity: warning
