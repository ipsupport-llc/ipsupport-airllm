{{- if .Values.dlpBert.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airllm.dlpBertServiceName" . }}
  labels:
    {{- include "airllm.labels" . | nindent 4 }}
    app.kubernetes.io/component: dlp-bert
spec:
  {{- if eq .Values.dlpBert.autoscaling.kind "none" }}
  replicas: {{ .Values.dlpBert.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "airllm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dlp-bert
  template:
    metadata:
      labels:
        {{- include "airllm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dlp-bert
    spec:
      # The sidecar never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.dlpBert.podSecurityContext | nindent 8 }}
      containers:
        - name: dlp-bert
          image: {{ include "airllm.image" (dict "image" .Values.dlpBert.image "root" .) }}
          imagePullPolicy: {{ .Values.dlpBert.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.dlpBert.securityContext | nindent 12 }}
          env:
            # uvicorn listens here. It must equal the Service port: with a
            # headless Service the gateway dials pod IPs on that port directly.
            - name: PORT
              value: {{ .Values.dlpBert.service.port | quote }}
            # Serve only the model baked into the image; never reach the Hub.
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.dlpBert.service.port }}
              protocol: TCP
          startupProbe:
            # The model can take a while to load (torch + weights, first image pull).
            # Allow up to ~5min before liveness/readiness kick in, so a slow load
            # never CrashLoops the pod. /healthz answers only once the model is loaded.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.dlpBert.resources | nindent 12 }}
          {{- if .Values.dlpBert.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            # Python's tempfile needs a writable directory even to load the model.
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.dlpBert.securityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.dlpBert.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dlpBert.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dlpBert.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
