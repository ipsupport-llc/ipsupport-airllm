{{- if not .Values.existingSecret }}
{{- fail "existingSecret is required: create a Secret with keys database-url, redis-url, master-key, session-key (+ oidc-client-secret when authMode=oidc, admin-password optional) and set .Values.existingSecret to its name" }}
{{- end }}
{{- $wif := .Values.googleWorkloadIdentity }}
{{- if and $wif.enabled (or (not $wif.projectNumber) (not $wif.poolId) (not $wif.providerId) (not $wif.serviceAccount)) }}
{{- fail "googleWorkloadIdentity.enabled=true requires projectNumber, poolId, providerId and serviceAccount" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airllm.fullname" . }}
  labels:
    {{- include "airllm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "airllm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      {{- if $wif.enabled }}
      annotations:
        # The impersonated service account lives ONLY in the credential ConfigMap, and
        # the Google SDK parses that file once at startup. Without this, changing it
        # would leave the pod impersonating the old identity until an unrelated restart.
        checksum/gcp-wif: {{ include (print $.Template.BasePath "/gcp-wif-credential-config.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "airllm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "airllm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      containers:
        - name: airllm
          image: {{ include "airllm.image" (dict "image" .Values.image "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "airllm.fullname" . }}-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: redis-url
            - name: AIRLLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: master-key
            - name: AIRLLM_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: session-key
            - name: AIRLLM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: admin-password
                  optional: true
            {{- if eq .Values.config.authMode "oidc" }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: oidc-client-secret
            {{- end }}
            {{- if $wif.enabled }}
            # Points the Google SDK at the external-account config, so the `vertex`
            # provider can mint OAuth2 tokens as the pod's own cloud identity.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ include "airllm.gcpWifCredentialFile" . | quote }}
            {{- end }}
          startupProbe:
            # Gates liveness until the app has booted (migrations run on start);
            # allows up to ~60s before liveness takes over.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: captures
              mountPath: {{ .Values.config.captureBlobDir | quote }}
            {{- if .Values.app.securityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if $wif.enabled }}
            # Both read-only, so they cost nothing against readOnlyRootFilesystem.
            - name: gcp-token
              mountPath: {{ include "airllm.gcpWifTokenFile" . | dir | quote }}
              readOnly: true
            - name: gcp-creds
              mountPath: {{ include "airllm.gcpWifCredentialFile" . | dir | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: captures
          {{- if .Values.app.capture.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "airllm.fullname" . }}-captures
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.app.securityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if $wif.enabled }}
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "airllm.gcpWifAudience" . | quote }}
                  expirationSeconds: {{ $wif.tokenExpirationSeconds | default 3600 }}
                  path: {{ include "airllm.gcpWifTokenFile" . | base }}
        - name: gcp-creds
          configMap:
            name: {{ include "airllm.fullname" . }}-gcp-wif
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
