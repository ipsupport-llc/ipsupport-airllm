name: Deploy main

# After CI passes on main, build the images from that commit and write their
# digests into deploy/argocd/values-main.yaml. GitOps consumers that track main
# read that file, so a merge to main is the rollout — no chart bump, no tag.
# Release tags (release.yml) stay available for versioned images.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # rebuild both images from the current main

# One run at a time; a newer pending run replaces an older pending one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.diff.outputs.sha }}
      gateway: ${{ steps.diff.outputs.gateway }}
      dlp_bert: ${{ steps.diff.outputs.dlp_bert }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      # main is squash-merged, so HEAD~1 is the previous main commit. A
      # docs-only change rebuilds nothing; dlp-bert (torch + a model, slow)
      # rebuilds only when its own directory changed.
      - id: diff
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "dlp_bert=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD~1 HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$|^deploy/dlp-bert/|^deploy/argocd/values-main\.yaml$'; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -q '^deploy/dlp-bert/'; then
            echo "dlp_bert=true" >> "$GITHUB_OUTPUT"
          else
            echo "dlp_bert=false" >> "$GITHUB_OUTPUT"
          fi

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/ipsupport-llc/ipsupport-airllm:${{ needs.changes.outputs.sha }}
            ghcr.io/ipsupport-llc/ipsupport-airllm:main
          build-args: |
            VERSION=main-${{ needs.changes.outputs.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  dlp-bert:
    needs: changes
    if: needs.changes.outputs.dlp_bert == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # pulls torch + a model at build time
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/dlp-bert
          file: deploy/dlp-bert/Dockerfile
          push: true
          tags: |
            ghcr.io/ipsupport-llc/ipsupport-airllm-dlp-bert:${{ needs.changes.outputs.sha }}
            ghcr.io/ipsupport-llc/ipsupport-airllm-dlp-bert:main
          build-args: |
            VERSION=main-${{ needs.changes.outputs.sha }}
          cache-from: type=gha,scope=dlp-bert
          cache-to: type=gha,scope=dlp-bert,mode=max

  # Write the new digests in one commit. Runs when every image that had to be
  # built was built; a failed build leaves the deployed digests untouched.
  bump:
    needs: [changes, gateway, dlp-bert]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.gateway.result == 'success' || needs.dlp-bert.result == 'success') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write digests to values-main.yaml (retry on race)
        env:
          SHA: ${{ needs.changes.outputs.sha }}
          GATEWAY: ${{ needs.gateway.outputs.digest }}
          DLP_BERT: ${{ needs.dlp-bert.outputs.digest }}
        run: |
          set -euo pipefail
          F=deploy/argocd/values-main.yaml
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            if [ -n "$GATEWAY" ]; then yq -i ".image.digest = \"$GATEWAY\"" "$F"; fi
            if [ -n "$DLP_BERT" ]; then yq -i ".dlpBert.image.digest = \"$DLP_BERT\"" "$F"; fi
            git add "$F"
            if git diff --staged --quiet; then echo "no change"; exit 0; fi
            git commit -m "chore(deploy): bump main image digests [skip ci]

          built-from=$SHA"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
